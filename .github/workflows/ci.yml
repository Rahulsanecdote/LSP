name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm --filter @lsp/sim run spread -- --clients 3 --beats 60

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lsp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @lsp/web e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
