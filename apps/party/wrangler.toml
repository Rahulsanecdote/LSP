# Cloudflare Workers + Durable Objects host for the beat engine.
# One Durable Object per room (the room code is the DO name). SQLite-backed so it runs on
# the Workers free plan. Deploy: pnpm --filter @lsp/party deploy:party
name = "lsp-party"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "BEAT_ROOM"
class_name = "BeatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BeatRoom"]

[observability]
enabled = true
